<!DOCTYPE html>
<html lang="zh-HK" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="香港支付方式全覆蓋的個人記賬工具：八達通、PayMe、AlipayHK、WeChat Pay HK、信用卡、轉數快等，支援分類統計、月度結算、預算、對賬與朋友分賬。">
<title>記賬本 · 香港</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="記賬本">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">記賬本<small>香港</small></div>
  <div class="top-actions">
    <span class="sync-dot" id="syncDot" title="同步狀態"></span>
    <button class="icon-btn" id="syncBtnTop" title="立即同步">⟳</button>
    <button class="icon-btn" id="themeBtnTop" title="切換主題">◐</button>
  </div>
</header>

<main id="view"></main>

<nav class="tabbar" id="tabbar"></nav>

<div id="toast"></div>

<div class="lock hidden" id="lock">
  <div class="lg">🔒</div>
  <div style="font-size:13px;color:var(--muted)">請輸入 4 位密碼</div>
  <div class="dots"><i></i><i></i><i></i><i></i></div>
  <div class="kp"></div>
</div>

<noscript>
  <div style="padding:40px;text-align:center">此應用需要 JavaScript 才能運作。</div>
</noscript>

<script src="./js/data.js"></script>
<script src="./js/charts.js"></script>
<script src="./js/ui-core.js"></script>
<script src="./js/ui-add.js"></script>
<script src="./js/ui-list.js"></script>
<script src="./js/ui-stats.js"></script>
<script src="./js/ui-settle.js"></script>
<script src="./js/qrcode.js"></script>
<script src="./js/ui-settings.js"></script>
<script src="./js/rates.js"></script>
<script src="./js/ocr.js"></script>
<script src="./js/bill.js"></script>
<script src="./js/backup.js"></script>
<script src="./js/sync.js"></script>
<script src="./js/ui-scan.js"></script>
<script src="./js/boot.js"></script>
</body>
</html>
